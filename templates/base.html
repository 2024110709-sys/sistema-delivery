<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema Delivery{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/repartidores.css' %}">
</head>
<body>
    <header class="site-header">
        <nav class="navbar">
            <a class="brand" href="{% url 'repartidores:lista' %}">🚚 Sistema Delivery</a>
            <div class="nav-links">
                <a href="{% url 'repartidores:lista' %}">Repartidores</a>
                <a href="{% url 'repartidores:crear' %}">Nuevo repartidor</a>
                <a href="/admin/">Admin</a>
            </div>
        </nav>
    </header>

    <main class="container">
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>Sistema Delivery — Hito 2 | Freddy · apps/repartidores</p>
    </footer>
</body>
</html>
